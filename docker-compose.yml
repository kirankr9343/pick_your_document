version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: pick_your_document_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@db:5432/pick_your_document
      - SECRET_KEY=PRODUCTION_SECRET_KEY_CHANGE_IN_PROD
    depends_on:
      - db
      - redis
    volumes:
      - temp_data:/app/storage/temp

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pick_your_document_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: pick_your_document_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=pick_your_document
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pick_your_document_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
  temp_data:
